<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bilhar 1v1</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0a; }
canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

const W = window.innerWidth;
const H = window.innerHeight;
c.width = W;
c.height = H;

// Layout
const BAR  = Math.round(H * 0.075);
const TY0  = BAR;
const TH   = H - BAR * 2;

// Physics constants
const BR    = Math.round(W * 0.037);   // ball radius
const PR    = BR * 1.7;                // pocket radius
const CUSH  = PR * 1.45;               // cushion thickness
const FRIC  = 0.9835;                  // friction per frame
const MSPD  = 0.07;                    // min speed to stop
const MAXPOW = 17;                     // max shot power

// Field bounds
const FL = CUSH, FR = W - CUSH;
const FT = TY0 + CUSH, FB = TY0 + TH - CUSH;

// Pockets (6)
const POCKETS = [
  { x: FL,       y: FT },
  { x: (FL+FR)/2, y: TY0 + PR * 0.4 },
  { x: FR,       y: FT },
  { x: FL,       y: FB },
  { x: (FL+FR)/2, y: TY0 + TH - PR * 0.4 },
  { x: FR,       y: FB },
];

// Ball colours (index = ball id)
const BCOL = [
  '#F0F0F0', // 0 white (cue)
  '#EEB800', // 1 yellow
  '#1040CC', // 2 blue
  '#CC1010', // 3 red
  '#7700AA', // 4 purple
  '#EE7000', // 5 orange
  '#008822', // 6 green
  '#880000', // 7 maroon
  '#111111', // 8 black
];

const ST = { WAIT:'wait', ROLL:'roll', OVER:'over' };
let state = ST.WAIT;
let curP  = 0;
let scores = [0, 0];
let balls  = [];
let snap   = null;   // ids pocketed before shot
let msg = '', msgT = 0;
let drag0 = null, drag1 = null;

// ─── INIT ─────────────────────────────────────────────────────────────
function mkBalls() {
  balls = [];
  balls.push({ id:0, x: FL+(FR-FL)*0.25, y:(FT+FB)/2, vx:0, vy:0, out:false });

  const rx  = FL + (FR-FL)*0.68;
  const ry  = (FT+FB)/2;
  const sp  = BR * 2.05;
  const ids = [1, 2, 3, 4, 8, 5, 6, 7]; // rack order (8 in middle)
  const pos = [
    [0,0],
    [1,-0.5],[1,0.5],
    [2,-1],[2,0],[2,1],
    [3,-0.5],[3,0.5],
  ];
  for(let i = 0; i < 8; i++){
    const [row,col] = pos[i];
    balls.push({
      id: ids[i],
      x:  rx + row * sp * 0.866,
      y:  ry + col * sp,
      vx:0, vy:0, out:false
    });
  }
}

// ─── HELPERS ──────────────────────────────────────────────────────────
const getCue    = () => balls.find(b => b.id===0 && !b.out);
const allStop   = () => balls.every(b => b.out || (Math.abs(b.vx)<MSPD && Math.abs(b.vy)<MSPD));

function showMsg(t){ msg = t; msgT = 180; }

function parsecol(hex){
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function lightcol(hex, t){
  const [r,g,b] = parsecol(hex);
  return `rgb(${Math.round(r+(255-r)*t)},${Math.round(g+(255-g)*t)},${Math.round(b+(255-b)*t)})`;
}
function darkcol(hex, t){
  const [r,g,b] = parsecol(hex);
  return `rgb(${Math.round(r*(1-t))},${Math.round(g*(1-t))},${Math.round(b*(1-t))})`;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ─── GAME LOGIC ───────────────────────────────────────────────────────
function doShoot(angle, pow){
  const cue = getCue();
  if(!cue) return;
  snap = new Set(balls.filter(b=>b.out).map(b=>b.id));
  cue.vx = Math.cos(angle)*pow;
  cue.vy = Math.sin(angle)*pow;
  state = ST.ROLL;
}

function endTurn(){
  const cueB    = balls.find(b=>b.id===0);
  const cueFoul = cueB?.out && !snap.has(0);
  const newOut  = balls.filter(b=>b.id!==0 && b.out && !snap.has(b.id));

  if(cueFoul){
    // Reset cue ball
    cueB.out = false;
    cueB.x   = FL+(FR-FL)*0.25;
    cueB.y   = (FT+FB)/2;
    cueB.vx  = cueB.vy = 0;
    curP = 1-curP;
    showMsg('⚠ Falta!  Vez do J'+(curP+1));
  } else if(newOut.length){
    scores[curP] += newOut.length;
    if(balls.filter(b=>b.id!==0&&!b.out).length===0){
      showMsg('🎱 Jogador '+(curP+1)+' VENCEU!');
      state = ST.OVER;
      return;
    }
    showMsg('J'+(curP+1)+' +'+ newOut.length + (newOut.length>1?' bolas!':" bola!"));
    // same player shoots again
  } else {
    curP = 1-curP;
    showMsg('Vez do Jogador '+(curP+1));
  }
  state = ST.WAIT;
}

// ─── PHYSICS ──────────────────────────────────────────────────────────
function update(){
  if(state !== ST.ROLL) return;

  for(const b of balls){
    if(b.out) continue;
    b.x += b.vx; b.y += b.vy;
    b.vx *= FRIC;  b.vy *= FRIC;
    if(Math.abs(b.vx)<MSPD) b.vx=0;
    if(Math.abs(b.vy)<MSPD) b.vy=0;

    // Cushion bounce
    if(b.x-BR < FL){ b.x=FL+BR; b.vx= Math.abs(b.vx)*0.77; }
    if(b.x+BR > FR){ b.x=FR-BR; b.vx=-Math.abs(b.vx)*0.77; }
    if(b.y-BR < FT){ b.y=FT+BR; b.vy= Math.abs(b.vy)*0.77; }
    if(b.y+BR > FB){ b.y=FB-BR; b.vy=-Math.abs(b.vy)*0.77; }
  }

  // Ball–ball collisions (elastic)
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      const a=balls[i], b=balls[j];
      if(a.out||b.out) continue;
      const dx=b.x-a.x, dy=b.y-a.y;
      const d=Math.hypot(dx,dy);
      if(d>0 && d<BR*2){
        const nx=dx/d, ny=dy/d;
        const ov=(BR*2-d)/2;
        a.x-=nx*ov; a.y-=ny*ov;
        b.x+=nx*ov; b.y+=ny*ov;
        const dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
        if(dv>0){
          a.vx-=dv*nx; a.vy-=dv*ny;
          b.vx+=dv*nx; b.vy+=dv*ny;
        }
      }
    }
  }

  // Pocket detection
  for(const b of balls){
    if(b.out) continue;
    for(const p of POCKETS){
      if(Math.hypot(b.x-p.x, b.y-p.y) < PR){
        b.out=true; b.vx=b.vy=0; break;
      }
    }
  }

  if(allStop()) endTurn();
}

// ─── DRAW ─────────────────────────────────────────────────────────────
function drawBall(b){
  const {x,y} = b;
  const col   = BCOL[b.id];

  // Shadow
  ctx.beginPath();
  ctx.arc(x+2, y+3, BR, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.fill();

  // 3D sphere gradient
  const g = ctx.createRadialGradient(x-BR*0.32,y-BR*0.38,BR*0.06, x+BR*0.1,y+BR*0.1,BR*1.05);
  g.addColorStop(0, lightcol(col, 0.58));
  g.addColorStop(0.45, col);
  g.addColorStop(1, darkcol(col, 0.52));
  ctx.beginPath();
  ctx.arc(x,y,BR,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.45)';
  ctx.lineWidth=0.8;
  ctx.stroke();

  if(b.id > 0){
    // White number disk
    ctx.beginPath();
    ctx.arc(x,y,BR*0.52,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.fill();
    ctx.fillStyle='#111';
    ctx.font=`bold ${Math.round(BR*0.68)}px Arial`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(b.id, x, y+1);
  }
}

function drawBar(screenY, flip, pIdx){
  ctx.save();
  if(flip){
    ctx.translate(W, screenY + BAR);
    ctx.rotate(Math.PI);
  } else {
    ctx.translate(0, screenY);
  }

  const active = curP === pIdx;
  ctx.fillStyle = active ? '#16213e' : '#080808';
  ctx.fillRect(0,0,W,BAR);

  // Active indicator stripe
  if(active){
    ctx.fillStyle='#FFD700';
    ctx.fillRect(0, flip ? BAR-3 : 0, W, 3);
  }

  const fs = Math.round(BAR * 0.42);
  ctx.font=`bold ${fs}px Arial`;
  ctx.textBaseline='middle';

  // Player label
  ctx.fillStyle = active ? '#FFD700' : '#444';
  ctx.textAlign='left';
  ctx.fillText(`J${pIdx+1}`, 14, BAR/2);

  // Score
  ctx.textAlign='right';
  ctx.fillStyle = active ? '#FFD700' : '#444';
  ctx.fillText(`${scores[pIdx]} pts`, W-14, BAR/2);

  // Turn status
  ctx.textAlign='center';
  if(active && state===ST.WAIT){
    ctx.fillStyle='#FFD700';
    ctx.font=`${Math.round(BAR*0.34)}px Arial`;
    ctx.fillText('▶ SUA VEZ — arraste para atirar', W/2, BAR/2);
  } else if(!active){
    ctx.fillStyle='#333';
    ctx.font=`${Math.round(BAR*0.3)}px Arial`;
    ctx.fillText(state===ST.ROLL ? 'rodando...' : 'aguardando...', W/2, BAR/2);
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // ── Table structure ──
  // Wood frame
  ctx.fillStyle='#5c3015';
  ctx.fillRect(0,TY0,W,TH);

  // Green felt
  ctx.fillStyle='#147030';
  ctx.fillRect(FL,FT,FR-FL,FB-FT);

  // Subtle center line
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(FL,(FT+FB)/2); ctx.lineTo(FR,(FT+FB)/2);
  ctx.stroke();

  // Head spot
  ctx.beginPath();
  ctx.arc(FL+(FR-FL)*0.25,(FT+FB)/2, BR*0.28, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fill();

  // Pockets
  for(const p of POCKETS){
    ctx.beginPath();
    ctx.arc(p.x,p.y, PR+2, 0, Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p.x,p.y, PR, 0, Math.PI*2);
    ctx.fillStyle='#060606';
    ctx.fill();
  }

  // ── Aim / cue stick ──
  const cue = getCue();
  if(state===ST.WAIT && drag0 && drag1 && cue){
    const dx=drag0.x-drag1.x, dy=drag0.y-drag1.y;
    const dist=Math.hypot(dx,dy);
    if(dist > 6){
      const ang = Math.atan2(dy,dx);
      const pow = Math.min(dist/8, MAXPOW);
      const aimLen = (FR-FL) * 0.5;

      // Dashed aim line
      ctx.save();
      ctx.strokeStyle='rgba(255,255,200,0.65)';
      ctx.lineWidth=1.5;
      ctx.setLineDash([BR*0.9, BR*0.55]);
      ctx.beginPath();
      ctx.moveTo(cue.x,cue.y);
      ctx.lineTo(cue.x+Math.cos(ang)*aimLen, cue.y+Math.sin(ang)*aimLen);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // Cue stick
      ctx.save();
      ctx.translate(cue.x, cue.y);
      ctx.rotate(ang + Math.PI);
      const off = BR * 1.1 + pow * 1.1;
      const stL = W * 0.48;
      const sg = ctx.createLinearGradient(off, -BR*0.4, off+stL, BR*0.4);
      sg.addColorStop(0, '#D4943A');
      sg.addColorStop(0.35, '#9B6520');
      sg.addColorStop(1, '#3A1500');
      ctx.beginPath();
      ctx.moveTo(off,   -BR*0.28);
      ctx.lineTo(off+stL, -BR*0.55);
      ctx.lineTo(off+stL,  BR*0.55);
      ctx.lineTo(off,    BR*0.28);
      ctx.fillStyle=sg;
      ctx.fill();
      ctx.restore();

      // Power bar
      const bW=W*0.3, bH=5;
      const bX=W/2-bW/2;
      const bY=curP===0 ? H-BAR-12 : TY0+7;
      ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.fillRect(bX-1,bY-1,bW+2,bH+2);
      const bg=ctx.createLinearGradient(bX,0,bX+bW,0);
      bg.addColorStop(0,'#44ff44');
      bg.addColorStop(0.65,'#ffdd00');
      bg.addColorStop(1,'#ff3300');
      ctx.fillStyle=bg;
      ctx.fillRect(bX, bY, bW*(pow/MAXPOW), bH);
    }
  }

  // ── Balls ──
  for(const b of balls){
    if(!b.out) drawBall(b);
  }

  // ── Message toast ──
  if(msgT > 0){
    msgT--;
    const a = Math.min(1, msgT/45);
    const fs = Math.round(W*0.048);
    ctx.font=`bold ${fs}px Arial`;
    const tw = ctx.measureText(msg).width;
    const bw=tw+30, bh=fs*1.9;
    const bx=W/2-bw/2, by=(FT+FB)/2-bh/2;
    ctx.fillStyle=`rgba(0,0,0,${a*0.82})`;
    roundRect(bx,by,bw,bh,10);
    ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(msg, W/2, (FT+FB)/2);
  }

  // ── Game over overlay ──
  if(state===ST.OVER){
    ctx.fillStyle='rgba(0,0,0,0.72)';
    ctx.fillRect(0,TY0,W,TH);
    const fs=Math.round(W*0.068);
    ctx.font=`bold ${fs}px Arial`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle='#FFD700';
    ctx.fillText(msg, W/2, (FT+FB)/2 - fs*1.3);

    const bw=W*0.58, bh=BAR*1.05;
    const bx=W/2-bw/2, by=(FT+FB)/2-fs*0.1;
    ctx.fillStyle='#FFD700';
    roundRect(bx,by,bw,bh,bh/2);
    ctx.fill();
    ctx.fillStyle='#111';
    ctx.font=`bold ${Math.round(fs*0.55)}px Arial`;
    ctx.textBaseline='middle';
    ctx.fillText('Jogar Novamente', W/2, by+bh/2);
  }

  // ── Player bars ──
  drawBar(0,        true,  1);   // top = J2 (flipped)
  drawBar(H - BAR, false,  0);   // bottom = J1
}

// ─── INPUT ────────────────────────────────────────────────────────────
function getXY(e){
  const rect = c.getBoundingClientRect();
  const sc   = W / rect.width;
  const t    = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
  return { x:(t.clientX-rect.left)*sc, y:(t.clientY-rect.top)*sc };
}

function onDown(e){
  e.preventDefault();
  const pos = getXY(e);
  if(state===ST.OVER){
    const bw=W*0.58, bh=BAR*1.05;
    const bx=W/2-bw/2, by=(FT+FB)/2-W*0.068*0.1;
    if(pos.x>=bx&&pos.x<=bx+bw&&pos.y>=by&&pos.y<=by+bh) restart();
    return;
  }
  if(state!==ST.WAIT) return;
  drag0 = pos;
  drag1 = {...pos};
}

function onMove(e){
  e.preventDefault();
  if(!drag0 || state!==ST.WAIT) return;
  drag1 = getXY(e);
}

function onUp(e){
  e.preventDefault();
  if(!drag0||!drag1||state!==ST.WAIT){ drag0=drag1=null; return; }
  const dx=drag0.x-drag1.x, dy=drag0.y-drag1.y;
  const d=Math.hypot(dx,dy);
  if(d > 8) doShoot(Math.atan2(dy,dx), Math.min(d/8, MAXPOW));
  drag0=drag1=null;
}

c.addEventListener('touchstart', onDown, {passive:false});
c.addEventListener('touchmove',  onMove, {passive:false});
c.addEventListener('touchend',   onUp,   {passive:false});
c.addEventListener('mousedown',  onDown);
c.addEventListener('mousemove',  onMove);
c.addEventListener('mouseup',    onUp);

// ─── START ────────────────────────────────────────────────────────────
function restart(){
  scores=[0,0]; curP=0; state=ST.WAIT;
  msg=''; msgT=0; drag0=drag1=null;
  mkBalls();
  showMsg('Vez do Jogador 1');
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

mkBalls();
showMsg('Vez do Jogador 1  •  arraste para atirar');
loop();
</script>
</body>
</html>
