<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Jogos 2P</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; }
body { background:#0a0a14; }

#hub {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center;
  padding:24px 16px 20px;
  background:linear-gradient(150deg,#0a0a1e 0%,#0f1028 100%);
  overflow-y:auto; gap:0;
}
.hub-logo {
  font-size:clamp(26px,7vw,40px); font-weight:900; color:#FFD700;
  letter-spacing:3px; text-align:center;
  text-shadow:0 0 30px rgba(255,215,0,.35); margin-bottom:4px;
}
.hub-tag { font-size:11px; color:#444; letter-spacing:3px; margin-bottom:22px; }
.score-board {
  display:flex; align-items:center; gap:20px;
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07);
  border-radius:16px; padding:14px 30px; margin-bottom:26px;
}
.sb-player { display:flex; flex-direction:column; align-items:center; }
.sb-name { font-size:11px; color:#555; letter-spacing:1px; margin-bottom:2px; }
.sb-score { font-size:34px; font-weight:900; color:#FFD700; }
.sb-vs { font-size:13px; color:#333; font-weight:700; }
.games-list { display:flex; flex-direction:column; gap:12px; width:100%; max-width:400px; }
.game-card {
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07);
  border-radius:18px; padding:15px 16px; cursor:pointer;
  -webkit-user-select:none; user-select:none;
  transition:background .12s;
}
.game-card:active { background:rgba(255,215,0,.08); border-color:rgba(255,215,0,.3); }
.gc-icon { font-size:38px; }
.gc-info { flex:1; }
.gc-name { color:#e8e8e8; font-size:17px; font-weight:700; }
.gc-desc { color:#555; font-size:12px; margin-top:2px; }
.gc-play { background:#FFD700; color:#111; font-size:12px; font-weight:900; padding:8px 16px; border-radius:20px; }

.game-screen { position:absolute; inset:0; display:none; }
.game-screen.active { display:block; }
canvas { display:block; touch-action:none; }

#back-btn {
  position:fixed; top:12px; left:12px;
  background:rgba(0,0,0,.7); color:rgba(255,255,255,.75);
  font-size:12px; font-weight:700; padding:7px 13px;
  border-radius:20px; border:1px solid rgba(255,255,255,.15);
  cursor:pointer; z-index:999; display:none;
  -webkit-user-select:none; user-select:none;
}
</style>
</head>
<body>

<div id="hub">
  <div class="hub-logo">🕹 MINI JOGOS</div>
  <div class="hub-tag">2 JOGADORES</div>
  <div class="score-board">
    <div class="sb-player"><div class="sb-name">JOGADOR 1</div><div class="sb-score" id="hs0">0</div></div>
    <div class="sb-vs">VS</div>
    <div class="sb-player"><div class="sb-name">JOGADOR 2</div><div class="sb-score" id="hs1">0</div></div>
  </div>
  <div class="games-list">
    <div class="game-card" onclick="Platform.launch('bilhar')">
      <div class="gc-icon">🎱</div>
      <div class="gc-info"><div class="gc-name">Bilhar</div><div class="gc-desc">Encaçape mais bolas que o adversário</div></div>
      <div class="gc-play">JOGAR</div>
    </div>
    <div class="game-card" onclick="Platform.launch('airhockey')">
      <div class="gc-icon">🏒</div>
      <div class="gc-info"><div class="gc-name">Air Hockey</div><div class="gc-desc">Primeiro a 7 gols vence a partida</div></div>
      <div class="gc-play">JOGAR</div>
    </div>
  </div>
</div>

<div id="screen-bilhar" class="game-screen"><canvas id="cv-bilhar"></canvas></div>
<div id="screen-airhockey" class="game-screen"><canvas id="cv-airhockey"></canvas></div>
<div id="back-btn" onclick="Platform.back()">← Menu</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════
//  PLATFORM
// ═══════════════════════════════════════════════════
const Platform = {
  wins: [0, 0],
  current: null,
  launch(name) {
    document.getElementById('hub').style.display = 'none';
    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('back-btn').style.display = 'block';
    this.current = name;
    Games[name].init();
  },
  back() {
    if (this.current) {
      Games[this.current].destroy();
      document.getElementById('screen-' + this.current).classList.remove('active');
    }
    document.getElementById('back-btn').style.display = 'none';
    document.getElementById('hub').style.display = 'flex';
    this.current = null;
  },
  addWin(p) {
    this.wins[p]++;
    document.getElementById('hs0').textContent = this.wins[0];
    document.getElementById('hs1').textContent = this.wins[1];
  }
};

// ═══════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════
function pcol(hex) { return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }
function lcol(hex,t) { const[r,g,b]=pcol(hex);return`rgb(${~~(r+(255-r)*t)},${~~(g+(255-g)*t)},${~~(b+(255-b)*t)})`; }
function dcol(hex,t) { const[r,g,b]=pcol(hex);return`rgb(${~~(r*(1-t))},${~~(g*(1-t))},${~~(b*(1-t))})`; }
function rrect(X,x,y,w,h,r){
  X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);
  X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();
}

// ═══════════════════════════════════════════════════
//  BILHAR
// ═══════════════════════════════════════════════════
const Bilhar = (() => {
  let cv,X,raf,live=false,evOk=false;
  let W,H,BAR,TY0,TH,BR,PR,CUSH,FL,FR,FT,FB;
  const POCKETS=[];
  const BCOL=['#F0F0F0','#EEB800','#1040CC','#CC1010','#7700AA','#EE7000','#008822','#880000','#111111'];
  const FRIC=0.9835,MSPD=0.07,MAXPOW=17;
  const ST={W:0,R:1,O:2};
  let state,curP,scores,balls,snap,msg,msgT,d0,d1;

  function setup(){
    W=window.innerWidth;H=window.innerHeight;cv.width=W;cv.height=H;
    BAR=~~(H*.075);TY0=BAR;TH=H-BAR*2;
    BR=~~(W*.037);PR=BR*1.7;CUSH=PR*1.45;
    FL=CUSH;FR=W-CUSH;FT=TY0+CUSH;FB=TY0+TH-CUSH;
    POCKETS.length=0;
    POCKETS.push({x:FL,y:FT},{x:(FL+FR)/2,y:TY0+PR*.4},{x:FR,y:FT},
                 {x:FL,y:FB},{x:(FL+FR)/2,y:TY0+TH-PR*.4},{x:FR,y:FB});
  }
  function mkBalls(){
    balls=[];
    balls.push({id:0,x:FL+(FR-FL)*.25,y:(FT+FB)/2,vx:0,vy:0,out:false});
    const rx=FL+(FR-FL)*.68,ry=(FT+FB)/2,sp=BR*2.05;
    const ids=[1,2,3,4,8,5,6,7];
    const pos=[[0,0],[1,-.5],[1,.5],[2,-1],[2,0],[2,1],[3,-.5],[3,.5]];
    for(let i=0;i<8;i++){
      const[row,col]=pos[i];
      balls.push({id:ids[i],x:rx+row*sp*.866,y:ry+col*sp,vx:0,vy:0,out:false});
    }
  }
  const getCue=()=>balls.find(b=>b.id===0&&!b.out);
  const allStop=()=>balls.every(b=>b.out||(Math.abs(b.vx)<MSPD&&Math.abs(b.vy)<MSPD));
  const showMsg=t=>{msg=t;msgT=180;};

  function doShoot(ang,pow){
    const c=getCue();if(!c)return;
    snap=new Set(balls.filter(b=>b.out).map(b=>b.id));
    c.vx=Math.cos(ang)*pow;c.vy=Math.sin(ang)*pow;state=ST.R;
  }
  function endTurn(){
    const cb=balls.find(b=>b.id===0);
    const foul=cb?.out&&!snap.has(0);
    const no=balls.filter(b=>b.id!==0&&b.out&&!snap.has(b.id));
    if(foul){
      cb.out=false;cb.x=FL+(FR-FL)*.25;cb.y=(FT+FB)/2;cb.vx=cb.vy=0;
      curP=1-curP;showMsg('⚠ Falta! Vez do J'+(curP+1));
    } else if(no.length){
      scores[curP]+=no.length;
      if(!balls.find(b=>b.id!==0&&!b.out)){
        showMsg('🎱 J'+(curP+1)+' VENCEU!');Platform.addWin(curP);state=ST.O;return;
      }
      showMsg('J'+(curP+1)+' +'+no.length);
    } else { curP=1-curP;showMsg('Vez do J'+(curP+1)); }
    state=ST.W;
  }
  function update(){
    if(state!==ST.R)return;
    for(const b of balls){
      if(b.out)continue;
      b.x+=b.vx;b.y+=b.vy;b.vx*=FRIC;b.vy*=FRIC;
      if(Math.abs(b.vx)<MSPD)b.vx=0;if(Math.abs(b.vy)<MSPD)b.vy=0;
      if(b.x-BR<FL){b.x=FL+BR;b.vx=Math.abs(b.vx)*.77;}
      if(b.x+BR>FR){b.x=FR-BR;b.vx=-Math.abs(b.vx)*.77;}
      if(b.y-BR<FT){b.y=FT+BR;b.vy=Math.abs(b.vy)*.77;}
      if(b.y+BR>FB){b.y=FB-BR;b.vy=-Math.abs(b.vy)*.77;}
    }
    for(let i=0;i<balls.length;i++){
      for(let j=i+1;j<balls.length;j++){
        const a=balls[i],b=balls[j];if(a.out||b.out)continue;
        const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
        if(d>0&&d<BR*2){
          const nx=dx/d,ny=dy/d,ov=(BR*2-d)/2;
          a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
          const dv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
          if(dv>0){a.vx-=dv*nx;a.vy-=dv*ny;b.vx+=dv*nx;b.vy+=dv*ny;}
        }
      }
    }
    for(const b of balls){
      if(b.out)continue;
      for(const p of POCKETS)if(Math.hypot(b.x-p.x,b.y-p.y)<PR){b.out=true;b.vx=b.vy=0;break;}
    }
    if(allStop())endTurn();
  }
  function drawBall(b){
    const{x,y}=b,col=BCOL[b.id];
    X.beginPath();X.arc(x+2,y+3,BR,0,Math.PI*2);X.fillStyle='rgba(0,0,0,.28)';X.fill();
    const g=X.createRadialGradient(x-BR*.32,y-BR*.38,BR*.06,x+BR*.1,y+BR*.1,BR*1.05);
    g.addColorStop(0,lcol(col,.58));g.addColorStop(.45,col);g.addColorStop(1,dcol(col,.52));
    X.beginPath();X.arc(x,y,BR,0,Math.PI*2);X.fillStyle=g;X.fill();
    X.strokeStyle='rgba(0,0,0,.45)';X.lineWidth=.8;X.stroke();
    if(b.id>0){
      X.beginPath();X.arc(x,y,BR*.52,0,Math.PI*2);X.fillStyle='rgba(255,255,255,.92)';X.fill();
      X.fillStyle='#111';X.font=`bold ${~~(BR*.68)}px Arial`;
      X.textAlign='center';X.textBaseline='middle';X.fillText(b.id,x,y+1);
    }
  }
  function drawBar(sy,flip,pi){
    X.save();flip?(X.translate(W,sy+BAR),X.rotate(Math.PI)):X.translate(0,sy);
    const act=curP===pi;
    X.fillStyle=act?'#16213e':'#080808';X.fillRect(0,0,W,BAR);
    if(act){X.fillStyle='#FFD700';X.fillRect(0,flip?BAR-3:0,W,3);}
    X.font=`bold ${~~(BAR*.42)}px Arial`;X.textBaseline='middle';
    X.fillStyle=act?'#FFD700':'#444';
    X.textAlign='left';X.fillText('J'+(pi+1),14,BAR/2);
    X.textAlign='right';X.fillText(scores[pi]+' pts',W-14,BAR/2);
    X.textAlign='center';
    if(act&&state===ST.W){
      X.fillStyle='#FFD700';X.font=`${~~(BAR*.3)}px Arial`;
      X.fillText('▶ SUA VEZ — arraste para atirar',W/2,BAR/2);
    } else {
      X.fillStyle='#333';X.font=`${~~(BAR*.28)}px Arial`;
      X.fillText(state===ST.R?'rodando...':'aguardando...',W/2,BAR/2);
    }
    X.restore();
  }
  function draw(){
    X.clearRect(0,0,W,H);
    X.fillStyle='#5c3015';X.fillRect(0,TY0,W,TH);
    X.fillStyle='#147030';X.fillRect(FL,FT,FR-FL,FB-FT);
    X.strokeStyle='rgba(255,255,255,.06)';X.lineWidth=1;
    X.beginPath();X.moveTo(FL,(FT+FB)/2);X.lineTo(FR,(FT+FB)/2);X.stroke();
    X.beginPath();X.arc(FL+(FR-FL)*.25,(FT+FB)/2,BR*.28,0,Math.PI*2);
    X.fillStyle='rgba(255,255,255,.12)';X.fill();
    for(const p of POCKETS){
      X.beginPath();X.arc(p.x,p.y,PR+2,0,Math.PI*2);X.fillStyle='rgba(0,0,0,.7)';X.fill();
      X.beginPath();X.arc(p.x,p.y,PR,0,Math.PI*2);X.fillStyle='#060606';X.fill();
    }
    const cue=getCue();
    if(state===ST.W&&d0&&d1&&cue){
      const dx=d0.x-d1.x,dy=d0.y-d1.y,dist=Math.hypot(dx,dy);
      if(dist>6){
        const ang=Math.atan2(dy,dx),pow=Math.min(dist/8,MAXPOW);
        X.save();X.strokeStyle='rgba(255,255,200,.65)';X.lineWidth=1.5;
        X.setLineDash([BR*.9,BR*.55]);
        X.beginPath();X.moveTo(cue.x,cue.y);
        X.lineTo(cue.x+Math.cos(ang)*(FR-FL)*.5,cue.y+Math.sin(ang)*(FR-FL)*.5);
        X.stroke();X.setLineDash([]);X.restore();
        X.save();X.translate(cue.x,cue.y);X.rotate(ang+Math.PI);
        const off=BR*1.1+pow*1.1,sl=W*.48;
        const sg=X.createLinearGradient(off,-BR*.4,off+sl,BR*.4);
        sg.addColorStop(0,'#D4943A');sg.addColorStop(.35,'#9B6520');sg.addColorStop(1,'#3A1500');
        X.beginPath();X.moveTo(off,-BR*.28);X.lineTo(off+sl,-BR*.55);
        X.lineTo(off+sl,BR*.55);X.lineTo(off,BR*.28);X.fillStyle=sg;X.fill();X.restore();
        const bW=W*.3,bH=5,bX=W/2-W*.15,bY=curP===0?H-BAR-12:TY0+7;
        X.fillStyle='rgba(0,0,0,.55)';X.fillRect(bX-1,bY-1,bW+2,bH+2);
        const bg=X.createLinearGradient(bX,0,bX+bW,0);
        bg.addColorStop(0,'#44ff44');bg.addColorStop(.65,'#ffdd00');bg.addColorStop(1,'#ff3300');
        X.fillStyle=bg;X.fillRect(bX,bY,bW*(pow/MAXPOW),bH);
      }
    }
    for(const b of balls)if(!b.out)drawBall(b);
    if(msgT>0){
      msgT--;const a=Math.min(1,msgT/45),fs=~~(W*.048);
      X.font=`bold ${fs}px Arial`;const tw=X.measureText(msg).width;
      const bw=tw+30,bh=fs*1.9,bx=W/2-bw/2,by=(FT+FB)/2-bh/2;
      X.fillStyle=`rgba(0,0,0,${a*.82})`;rrect(X,bx,by,bw,bh,10);X.fill();
      X.fillStyle=`rgba(255,255,255,${a})`;X.textAlign='center';X.textBaseline='middle';
      X.fillText(msg,W/2,(FT+FB)/2);
    }
    if(state===ST.O){
      X.fillStyle='rgba(0,0,0,.72)';X.fillRect(0,TY0,W,TH);
      const fs=~~(W*.068);
      X.font=`bold ${fs}px Arial`;X.textAlign='center';X.textBaseline='middle';
      X.fillStyle='#FFD700';X.fillText(msg,W/2,(FT+FB)/2-fs*1.3);
      const bw=W*.58,bh=BAR*1.05,bx=W/2-bw/2,by=(FT+FB)/2-fs*.1;
      X.fillStyle='#FFD700';rrect(X,bx,by,bw,bh,bh/2);X.fill();
      X.fillStyle='#111';X.font=`bold ${~~(fs*.55)}px Arial`;
      X.fillText('Jogar Novamente',W/2,by+bh/2);
    }
    drawBar(0,true,1);drawBar(H-BAR,false,0);
  }
  function gxy(e){
    const r=cv.getBoundingClientRect(),sc=W/r.width;
    const t=e.touches?(e.touches[0]||e.changedTouches[0]):e;
    return{x:(t.clientX-r.left)*sc,y:(t.clientY-r.top)*sc};
  }
  function onDown(e){
    e.preventDefault();if(!live)return;
    const pos=gxy(e);
    if(state===ST.O){
      const bw=W*.58,bh=BAR*1.05,bx=W/2-bw/2,by=(FT+FB)/2-~~(W*.068)*.1;
      if(pos.x>=bx&&pos.x<=bx+bw&&pos.y>=by&&pos.y<=by+bh)restart();return;
    }
    if(state!==ST.W)return;d0=pos;d1={...pos};
  }
  function onMove(e){e.preventDefault();if(!live||!d0||state!==ST.W)return;d1=gxy(e);}
  function onUp(e){
    e.preventDefault();if(!live||!d0||!d1||state!==ST.W){d0=d1=null;return;}
    const dx=d0.x-d1.x,dy=d0.y-d1.y,d=Math.hypot(dx,dy);
    if(d>8)doShoot(Math.atan2(dy,dx),Math.min(d/8,MAXPOW));
    d0=d1=null;
  }
  function restart(){
    scores=[0,0];curP=0;state=ST.W;msg='';msgT=0;d0=d1=null;
    mkBalls();showMsg('Vez do Jogador 1');
  }
  function loop(){ if(!live)return;update();draw();raf=requestAnimationFrame(loop); }

  return {
    init(){
      cv=document.getElementById('cv-bilhar');X=cv.getContext('2d');
      live=true;setup();restart();
      if(!evOk){
        cv.addEventListener('touchstart',onDown,{passive:false});
        cv.addEventListener('touchmove',onMove,{passive:false});
        cv.addEventListener('touchend',onUp,{passive:false});
        cv.addEventListener('mousedown',onDown);
        cv.addEventListener('mousemove',onMove);
        cv.addEventListener('mouseup',onUp);
        evOk=true;
      }
      loop();
    },
    destroy(){ live=false;cancelAnimationFrame(raf); }
  };
})();

// ═══════════════════════════════════════════════════
//  AIR HOCKEY
// ═══════════════════════════════════════════════════
const AirHockey = (() => {
  let cv,X,raf,live=false,evOk=false;
  let W,H,PR,MR,GW,COR=1.15;
  const WIN_SCORE=7;
  let puck,m1,m2,scores,state,goalMsg,goalWinner,goalTimer;
  // state: 'play','goal','over'

  function setup(){
    W=window.innerWidth;H=window.innerHeight;cv.width=W;cv.height=H;
    PR=~~(W*.055);MR=~~(W*.082);GW=~~(W*.38);
  }
  function reset(){
    scores=[0,0];state='play';goalMsg='';goalWinner=-1;goalTimer=0;
    puck={x:W/2,y:H/2,vx:0,vy:2.5};
    m1={x:W/2,y:H*.75,px:W/2,py:H*.75,vx:0,vy:0};
    m2={x:W/2,y:H*.25,px:W/2,py:H*.25,vx:0,vy:0};
  }
  function servePuck(lastScorer){
    puck.x=W/2;puck.y=H/2;
    const dir=lastScorer===0?1:-1;
    puck.vx=(Math.random()-.5)*3;
    puck.vy=dir*3;
  }

  function update(){
    if(state==='goal'){
      goalTimer--;
      if(goalTimer<=0){servePuck(goalWinner);state='play';}
      return;
    }
    if(state!=='play')return;

    puck.x+=puck.vx;puck.y+=puck.vy;
    puck.vx*=.999;puck.vy*=.999;

    // Walls left/right
    if(puck.x-PR<0){puck.x=PR;puck.vx=Math.abs(puck.vx)*.88;}
    if(puck.x+PR>W){puck.x=W-PR;puck.vx=-Math.abs(puck.vx)*.88;}

    // Top/bottom walls — goal if within goal width
    const inGoal=puck.x>W/2-GW/2&&puck.x<W/2+GW/2;
    if(puck.y-PR<0){
      if(inGoal){scored(0);return;}
      puck.y=PR;puck.vy=Math.abs(puck.vy)*.88;
    }
    if(puck.y+PR>H){
      if(inGoal){scored(1);return;}
      puck.y=H-PR;puck.vy=-Math.abs(puck.vy)*.88;
    }

    // Speed cap
    const spd=Math.hypot(puck.vx,puck.vy);
    if(spd>22){puck.vx*=22/spd;puck.vy*=22/spd;}

    // Mallet velocity
    m1.vx=m1.x-m1.px;m1.vy=m1.y-m1.py;m2.vx=m2.x-m2.px;m2.vy=m2.y-m2.py;
    m1.px=m1.x;m1.py=m1.y;m2.px=m2.x;m2.py=m2.y;

    // Mallet-puck collision
    for(const m of[m1,m2]){
      const dx=puck.x-m.x,dy=puck.y-m.y,d=Math.hypot(dx,dy),md=PR+MR;
      if(d>0&&d<md){
        const nx=dx/d,ny=dy/d;
        puck.x+=nx*(md-d);puck.y+=ny*(md-d);
        const rv=(puck.vx-m.vx)*nx+(puck.vy-m.vy)*ny;
        if(rv<0){
          const imp=-(1+COR)*rv;
          puck.vx+=imp*nx;puck.vy+=imp*ny;
        }
        // Speed cap post-hit
        const s2=Math.hypot(puck.vx,puck.vy);
        if(s2>22){puck.vx*=22/s2;puck.vy*=22/s2;}
      }
    }
  }

  function scored(p){
    scores[p]++;goalWinner=p;goalTimer=110;
    if(scores[p]>=WIN_SCORE){
      goalMsg='🏆 J'+(p+1)+' VENCEU!';state='over';Platform.addWin(p);
    } else {
      goalMsg='⚽ GOL do J'+(p+1)+'!';state='goal';
    }
  }

  function moveMallets(touches){
    let got1=false,got2=false;
    for(const t of touches){
      const r=cv.getBoundingClientRect(),sc=W/r.width;
      const tx=(t.clientX-r.left)*sc,ty=(t.clientY-r.top)*sc;
      if(ty>H/2&&!got1){
        m1.x=Math.max(MR,Math.min(W-MR,tx));
        m1.y=Math.max(H/2+MR,Math.min(H-MR,ty));
        got1=true;
      } else if(ty<=H/2&&!got2){
        m2.x=Math.max(MR,Math.min(W-MR,tx));
        m2.y=Math.max(MR,Math.min(H/2-MR,ty));
        got2=true;
      }
    }
  }
  function onTouch(e){
    e.preventDefault();if(!live)return;
    if(state==='over'&&e.type==='touchstart'){reset();return;}
    moveMallets(e.touches);
  }
  function onMouse(e){
    if(!live||state==='over')return;
    const r=cv.getBoundingClientRect(),sc=W/r.width;
    const mx=(e.clientX-r.left)*sc,my=(e.clientY-r.top)*sc;
    if(my>H/2){m1.x=Math.max(MR,Math.min(W-MR,mx));m1.y=Math.max(H/2+MR,Math.min(H-MR,my));}
    else{m2.x=Math.max(MR,Math.min(W-MR,mx));m2.y=Math.max(MR,Math.min(H/2-MR,my));}
  }

  function draw(){
    X.clearRect(0,0,W,H);
    // Background
    const bg=X.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#071520');bg.addColorStop(.5,'#0b2035');bg.addColorStop(1,'#071520');
    X.fillStyle=bg;X.fillRect(0,0,W,H);
    // Rink border
    X.strokeStyle='rgba(255,255,255,.12)';X.lineWidth=3;
    X.strokeRect(2,2,W-4,H-4);
    // Ice lines
    X.strokeStyle='rgba(255,255,255,.03)';X.lineWidth=1;
    for(let y=0;y<H;y+=28){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke();}
    // Center line + circle
    X.strokeStyle='rgba(200,50,50,.3)';X.lineWidth=2;
    X.beginPath();X.moveTo(0,H/2);X.lineTo(W,H/2);X.stroke();
    X.beginPath();X.arc(W/2,H/2,W*.11,0,Math.PI*2);X.stroke();
    // Goals
    const gx=W/2-GW/2,gd=PR*1.8;
    X.fillStyle='rgba(50,180,255,.12)';X.fillRect(gx,0,GW,gd);
    X.strokeStyle='rgba(50,180,255,.7)';X.lineWidth=2;
    X.beginPath();X.moveTo(gx,0);X.lineTo(gx,gd);X.lineTo(gx+GW,gd);X.lineTo(gx+GW,0);X.stroke();
    X.fillStyle='rgba(255,60,60,.12)';X.fillRect(gx,H-gd,GW,gd);
    X.strokeStyle='rgba(255,60,60,.7)';X.lineWidth=2;
    X.beginPath();X.moveTo(gx,H);X.lineTo(gx,H-gd);X.lineTo(gx+GW,H-gd);X.lineTo(gx+GW,H);X.stroke();
    // Scores
    const sf=~~(W*.13);
    X.font=`900 ${sf}px Arial`;X.textAlign='center';X.textBaseline='middle';
    X.fillStyle='rgba(50,180,255,.2)';
    X.save();X.translate(W/2,H*.17);X.rotate(Math.PI);X.fillText(scores[1],0,0);X.restore();
    X.fillStyle='rgba(255,60,60,.2)';X.fillText(scores[0],W/2,H*.83);
    // Labels
    const lf=~~(W*.034);X.font=`bold ${lf}px Arial`;
    X.fillStyle='rgba(50,180,255,.55)';
    X.save();X.translate(W/2,H*.06);X.rotate(Math.PI);X.fillText('J2 — deslize com o dedo',0,0);X.restore();
    X.fillStyle='rgba(255,60,60,.55)';X.fillText('J1 — deslize com o dedo',W/2,H*.94);
    // Mallets
    function drawMallet(m,col,n){
      X.beginPath();X.arc(m.x+2,m.y+3,MR,0,Math.PI*2);X.fillStyle='rgba(0,0,0,.25)';X.fill();
      const g=X.createRadialGradient(m.x-MR*.3,m.y-MR*.35,MR*.08,m.x,m.y,MR);
      g.addColorStop(0,lcol(col,.5));g.addColorStop(.5,col);g.addColorStop(1,dcol(col,.45));
      X.beginPath();X.arc(m.x,m.y,MR,0,Math.PI*2);X.fillStyle=g;X.fill();
      X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=1.5;X.stroke();
      X.fillStyle='rgba(255,255,255,.9)';X.font=`900 ${~~(MR*.6)}px Arial`;
      X.textAlign='center';X.textBaseline='middle';X.fillText('J'+n,m.x,m.y+1);
    }
    drawMallet(m1,'#FF3333',1);drawMallet(m2,'#3399FF',2);
    // Puck
    const{x,y}=puck;
    X.beginPath();X.arc(x+2,y+3,PR,0,Math.PI*2);X.fillStyle='rgba(0,0,0,.35)';X.fill();
    const pg=X.createRadialGradient(x-PR*.25,y-PR*.3,PR*.05,x,y,PR);
    pg.addColorStop(0,'#555');pg.addColorStop(.5,'#1a1a1a');pg.addColorStop(1,'#000');
    X.beginPath();X.arc(x,y,PR,0,Math.PI*2);X.fillStyle=pg;X.fill();
    X.strokeStyle='rgba(255,255,255,.12)';X.lineWidth=1;X.stroke();
    // Goal/over overlay
    if(state==='goal'||state==='over'){
      const a=Math.min(1,(110-goalTimer+20)/20)||1;
      X.fillStyle=`rgba(0,0,0,${a*.6})`;X.fillRect(0,0,W,H);
      const fs=~~(W*.075);
      X.font=`900 ${fs}px Arial`;X.textAlign='center';X.textBaseline='middle';
      X.fillStyle='#FFD700';X.fillText(goalMsg,W/2,H/2);
      if(state==='over'){
        X.font=`bold ${~~(fs*.48)}px Arial`;
        X.fillStyle='rgba(255,255,255,.75)';
        X.fillText('Toque para jogar novamente',W/2,H/2+fs*1.3);
      }
    }
  }

  function loop(){ if(!live)return;update();draw();raf=requestAnimationFrame(loop); }

  return {
    init(){
      cv=document.getElementById('cv-airhockey');X=cv.getContext('2d');
      live=true;setup();reset();
      if(!evOk){
        cv.addEventListener('touchstart',onTouch,{passive:false});
        cv.addEventListener('touchmove',onTouch,{passive:false});
        cv.addEventListener('touchend',onTouch,{passive:false});
        cv.addEventListener('mousemove',onMouse);
        evOk=true;
      }
      loop();
    },
    destroy(){ live=false;cancelAnimationFrame(raf); }
  };
})();

const Games = { bilhar:Bilhar, airhockey:AirHockey };
</script>
</body>
</html>
